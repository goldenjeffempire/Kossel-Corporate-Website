# Render Blueprint for the public Kossel Ltd. website.
# A static site is served from Render's CDN and does not sleep, so no
# always-on web-service instance is needed for this frontend.
services:
  - type: web
    runtime: static
    name: kossel-ltd-website
    domains:
      - kosselgroup.com
    buildCommand: pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/kossel-website run build
    staticPublishPath: artifacts/kossel-website/dist/public
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - artifacts/kossel-website/**
        - attached_assets/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
